# Purpose: Validate code with lint, format, typecheck, and tests.
# Triggers: pull_request, workflow_dispatch.
# Callers:  n/a
# Owner:    MonsieurBarti
name: CI · Validate code

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-source:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install packages
        run: pnpm install --frozen-lockfile
      - name: Lint source
        run: pnpm lint

  check-format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install packages
        run: pnpm install --frozen-lockfile
      - name: Check format
        run: pnpm format:check

  typecheck-packages:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install packages
        run: pnpm install --frozen-lockfile
      - name: Typecheck packages
        run: pnpm typecheck

  run-unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install packages
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test:unit

  run-integration-tests:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://monsieurbarti:monsieurbarti@localhost:5432/backend_mono_test
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: monsieurbarti
          POSTGRES_PASSWORD: monsieurbarti
          POSTGRES_DB: backend_mono_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monsieurbarti -d backend_mono_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install packages
        run: pnpm install --frozen-lockfile
      - name: Run integration tests
        run: pnpm test:integration

  run-e2e-tests:
    name: E2E tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install packages
        run: pnpm install --frozen-lockfile
      - name: Run E2E tests
        run: pnpm test:e2e
