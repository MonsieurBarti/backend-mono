services:
  postgres:
    image: postgres:18.6
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monsieurbarti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monsieurbarti}
      POSTGRES_DB: ${POSTGRES_DB:-backend_mono}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monsieurbarti -d backend_mono"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.8.2
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  redis_data:
